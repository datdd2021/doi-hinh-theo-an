<title>Đội Hình Theo Ấn</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23ffd84a'/%3E%3Cstop offset='1' stop-color='%23f2a900'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 5.5 55 18.75v26.5L32 58.5 9 45.25v-26.5z' fill='url(%23g)' stroke='url(%23g)' stroke-width='7' stroke-linejoin='round'/%3E%3Cg transform='rotate(-38 32 32)' fill='%2314161a'%3E%3Crect x='22.5' y='10' width='19' height='22' rx='6'/%3E%3Crect x='29' y='30' width='6' height='25' rx='3'/%3E%3C/g%3E%3Cg transform='rotate(-38 32 32)' fill='url(%23g)'%3E%3Crect x='27' y='14.5' width='3.2' height='12.5' rx='1.6'/%3E%3Crect x='33.8' y='14.5' width='3.2' height='12.5' rx='1.6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Overpass:wght@400;500;600;700;800;900&display=swap">
<style>
/* Theo bố cục ứng dụng TFT Academy: hàng tier gồm các icon đội (carry chính), bấm vào để mở bảng chi tiết
   gồm thẻ carry bên trái và đội hình + bàn cờ vị trí bên phải. Màu/font đo từ trang của họ. */
:root {
  --bg: #0a0c0d;
  --bg-2: #0b0d0f;
  --card: #121417;
  --card-2: #1a1d21;
  --cell: #1d2024;
  --line: #2b2f34;
  --ink: #ffffff;
  --dim: #9ba1a8;
  --yellow: #ffc808;
  --c1: #acacac; --c2: #22c55e; --c3: #0090ff; --c4: #a855f7; --c5: #eab308;
  --s1: #fb1737; --s2: #fe3e4b;
  --a1: #fd551b; --a2: #ff8d1b;
  --b1: #ffd201; --b2: #f2e82f;
  --cc1: #16c047; --cc2: #7cf24a;
  --x1: #0ad2c4; --x2: #12ffdd;
  --g1: #3b5bdb; --g2: #748ffc;
  --bp1: #b47a55; --bp3: #a9b7c3; --bp5: #f1c94b; --bp4: #b98ce6;
  --display: "Anton", "Impact", sans-serif;
  --heavy: "Archivo Black", "Arial Black", sans-serif;
  --body: "Overpass", "Segoe UI", system-ui, sans-serif;
  --hex: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { margin: 0; font: 15px/1.4 var(--body); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
img, svg { display: block; }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 372px minmax(0, 1fr); align-items: start; min-height: 100vh; }

/* ================= Cột trái ================= */
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; overscroll-behavior: contain; padding: calc(env(safe-area-inset-top, 0px) + 16px) 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid var(--line); background: var(--bg-2); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.label { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 14px; margin: 0 0 10px; }
.label button, .sub button { font-size: 12.5px; font-weight: 700; color: var(--dim); }
.label button:hover, .sub button:hover { color: var(--yellow); }
.sub { font-size: 12.5px; font-weight: 800; color: var(--dim); margin: 12px 0 8px; display: flex; justify-content: space-between; }
.slots { display: flex; gap: 8px; }
.slot { width: 58px; height: 58px; clip-path: var(--hex); background: var(--line); display: grid; place-items: center; position: relative; }
.slot::before { content: ""; position: absolute; inset: 2px; clip-path: var(--hex); background: var(--bg-2); }
.slot img { position: absolute; inset: 0; margin: auto; width: 83%; height: 83%; clip-path: var(--hex); object-fit: cover; }
.slot svg { position: relative; width: 16px; height: 16px; stroke: var(--line); stroke-width: 2.5; fill: none; }
.slot.on { background: var(--yellow); }
.slot.on:hover { background: var(--s1); }
.want-slots .slot { width: 50px; height: 50px; }
.want-slots .slot img { position: absolute; inset: 0; margin: auto; width: 83%; height: 83%; clip-path: var(--hex); object-fit: cover; }
.levels { display: flex; gap: 6px; }
.levels button { flex: 1; height: 32px; border-radius: 999px; border: 1px solid var(--line); font-weight: 800; font-size: 13.5px; color: var(--dim); }
.levels button:hover { color: var(--ink); }
.levels button[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: #111; }
.carry-row { display: flex; align-items: center; gap: 10px; min-height: 50px; }
.carry-row .slot { width: 50px; height: 50px; }
.carry-row .slot img { position: absolute; inset: 0; margin: auto; width: 83%; height: 83%; clip-path: var(--hex); object-fit: cover; }
.carry-row .hint { font-size: 12px; color: var(--dim); }
.opts .levels { margin-bottom: 4px; }
.opts .levels button { height: 28px; font-size: 12.5px; }
.upick.carry::after { content: ""; position: absolute; top: -2px; right: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--x2); border: 2px solid var(--card); }
.upick.carry .nm { color: var(--x2); font-weight: 800; }
.bans { display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; align-items: center; }
.bans .b { width: 32px; height: 32px; clip-path: var(--hex); background: var(--s1); position: relative; }
.bans .b img { position: absolute; inset: 0; margin: auto; width: 82%; height: 82%; clip-path: var(--hex); object-fit: cover; filter: grayscale(1) brightness(.7); }
.bans .b::after { content: ""; position: absolute; left: 20%; right: 20%; top: 50%; height: 2px; background: var(--s2); transform: rotate(-35deg); }
.bans .empty { font-size: 12px; color: var(--dim); }
.ptabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin: -2px 0 12px; }
.ptabs button { padding: 0 0 8px; font-weight: 800; font-size: 14px; color: var(--dim); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.ptabs button[aria-selected="true"] { color: var(--yellow); border-color: var(--yellow); }
.emblems { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 2px; }
.emblems .emb .hx { width: 54px; height: 54px; }
.levels.lv { margin-top: 12px; }
.go { display: block; width: 100%; height: 42px; margin-top: 12px; border-radius: 8px; background: var(--yellow); color: #111; font: 900 15px/1 var(--body); letter-spacing: .02em; }
.go:hover { filter: brightness(1.08); }
.go:disabled { opacity: .6; cursor: progress; }
.go.pulse { animation: goPulse 1.6s ease-in-out infinite; }
@keyframes goPulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--yellow) 55%, transparent); } 50% { box-shadow: 0 0 0 6px transparent; } }
.stale-note { margin: 0 0 10px; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--yellow) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--yellow) 45%, transparent); font-size: 13px; }
.main.stale .tiers, .main.stale #detail, .main.stale .side { opacity: .4; pointer-events: none; transition: opacity .15s; }
details.opts summary { cursor: pointer; list-style: none; margin: 0; }
details.opts summary::after { content: "▾"; color: var(--dim); font-size: 12px; }
details.opts[open] summary { margin-bottom: 4px; }
details.opts[open] summary::after { content: "▴"; }
.side { display: grid; gap: 12px; align-content: start; min-width: 0; }
.side .rf { margin: 0; }
.emb { display: grid; justify-items: center; gap: 4px; position: relative; }
.emb .hx { width: 50px; height: 50px; clip-path: var(--hex); background: var(--line); display: grid; place-items: center; position: relative; }
.emb .hx::before { content: ""; position: absolute; inset: 2px; clip-path: var(--hex); background: var(--bg-2); }
.emb .hx img { position: absolute; inset: 0; margin: auto; width: calc(100% - 6px); height: calc(100% - 6px); clip-path: var(--hex); object-fit: cover; }
.emb .nm { font-size: 11px; line-height: 1.15; color: var(--dim); text-align: center; }
.emb .tier, .emb .cnt { position: absolute; z-index: 2; top: -3px; min-width: 18px; height: 16px; border-radius: 4px; font: 900 10px/16px var(--body); text-align: center; }
.emb .tier { right: 4px; color: var(--dim); background: var(--card-2); }
.emb .tier[data-t^="S"] { background: linear-gradient(0deg, var(--s1), var(--s2)); color: #fff; }
.emb .tier[data-t="A"] { background: linear-gradient(0deg, var(--a1), var(--a2)); color: #111; }
.emb .tier[data-t="B"] { background: linear-gradient(0deg, var(--b1), var(--b2)); color: #111; }
.emb .tier[data-t="C"] { background: linear-gradient(0deg, var(--cc1), var(--cc2)); color: #111; }
.emb .tier[data-t="D"] { background: var(--card-2); color: var(--s2); }
.emb.weak:not(.sel) .hx img { opacity: .55; }
.emb.weak:not(.sel) .nm { color: color-mix(in srgb, var(--dim) 70%, var(--s2)); }
.emb .cnt { left: 4px; background: var(--yellow); color: #111; }
.emb:hover .hx { background: var(--dim); }
.emb.sel .hx { background: var(--yellow); }
.emb.sel .nm { color: var(--yellow); font-weight: 800; }
.emb[disabled] { opacity: .35; cursor: default; }
.mode { display: flex; gap: 6px; margin-bottom: 10px; }
.mode button { flex: 1; height: 30px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; font-weight: 800; color: var(--dim); }
.mode button[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: #111; }
.mode button.ban[aria-pressed="true"] { background: var(--s1); border-color: var(--s1); color: #fff; }
.costs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
.costs button { height: 28px; border-radius: 8px; border: 1px solid var(--line); font-size: 13px; font-weight: 900; color: var(--dim); display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
.costs button i { width: 9px; height: 9px; border-radius: 50%; background: var(--c1); }
.costs button[data-c="2"] i { background: var(--c2); } .costs button[data-c="3"] i { background: var(--c3); }
.costs button[data-c="4"] i { background: var(--c4); } .costs button[data-c="5"] i { background: var(--c5); }
.costs button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--card-2); }
.search { width: 100%; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 14px var(--body); padding: 0 14px; margin-bottom: 12px; }
.search::placeholder { color: var(--dim); }
.ugrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px 2px; }
.ugrid .upick .hx { width: 52px; height: 52px; }
.upick { display: grid; justify-items: center; gap: 3px; position: relative; }
.upick .hx { width: 46px; height: 46px; clip-path: var(--hex); background: var(--c1); position: relative; }
.upick .hx img { position: absolute; inset: 0; margin: auto; width: 83%; height: 83%; clip-path: var(--hex); object-fit: cover; }
.upick[data-c="2"] .hx { background: var(--c2); } .upick[data-c="3"] .hx { background: var(--c3); }
.upick[data-c="4"] .hx { background: var(--c4); } .upick[data-c="5"] .hx { background: var(--c5); }
.upick .nm { font-size: 10.5px; line-height: 1.1; color: var(--dim); max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.upick.sel .nm { color: var(--yellow); font-weight: 800; }
.upick.sel::after, .upick.ban::after { content: ""; position: absolute; top: -2px; right: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--card); }
.upick.ban::after { background: var(--s1); }
.upick.ban .hx { filter: grayscale(1) brightness(.6); }
.upick.ban .nm { color: var(--s2); text-decoration: line-through; }
.upick[disabled] { opacity: .35; cursor: default; }
.src { font-size: 11.5px; color: var(--dim); line-height: 1.5; padding: 0 4px; }
.src a { color: var(--dim); }

/* --- Cột trái: kiểu trang tra cứu, phẳng, ít thẻ bo tròn --- */
.rail { gap: 0; padding: calc(env(safe-area-inset-top, 0px) + 6px) 0 0; }
.rail .panel { background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 14px 16px; }
.rail .label { font-size: 11.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 10px; }
.rail .label button, .rail .sub button { text-transform: none; letter-spacing: 0; font-weight: 700; }
.rail .sub { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
#slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
#slots .slot { width: 100%; height: auto; aspect-ratio: 1 / 1.07; }
#slots .slot img { width: 86%; height: 86%; }
#slots .slot svg { width: 20px; height: 20px; }
/* nhóm nút liền khối */
.rail .levels, .rail .mode, .ptabs { display: flex; gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
.rail .levels button, .rail .mode button, .ptabs button { flex: 1; height: 32px; border: 0; border-radius: 0; margin: 0; padding: 0; font-size: 13px; font-weight: 800; color: var(--dim); background: none; }
.rail .levels button + button, .rail .mode button + button, .ptabs button + button { border-left: 1px solid var(--line); }
.rail .levels button:hover, .rail .mode button:hover, .ptabs button:hover { color: var(--ink); background: var(--card); }
.rail .levels button[aria-pressed="true"], .rail .mode button[aria-pressed="true"] { background: var(--yellow); color: #111; }
.rail .mode button.ban[aria-pressed="true"] { background: var(--s1); color: #fff; }
.ptabs { margin: 0 0 12px; }
.ptabs button { height: 36px; font-size: 14px; }
.ptabs button[aria-selected="true"] { background: var(--yellow); color: #111; }
.levels.lv { margin-top: 12px; }
.rail .opts .levels button { height: 30px; font-size: 12.5px; }
.rail .costs { gap: 4px; }
.rail .costs button { height: 28px; border-radius: 4px; }
.rail .search { border-radius: 6px; }
.rail details.opts { border-bottom: 0; }
.rail .src { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--bg-2); }

/* ================= Cột phải ================= */
.main { min-width: 0; padding: calc(env(safe-area-inset-top, 0px) + 16px) 24px 40px; }
.wrap { max-width: 1180px; }
/* Màn hình rộng: lộ trình + đập ấn sang cột phải, ít phải cuộn */
@media (min-width: 1500px) {
  .wrap { max-width: 1640px; display: grid; grid-template-columns: minmax(0, 1fr) 420px; column-gap: 16px; align-items: start; }
  .wrap > :not(.side) { grid-column: 1; }
  .side { grid-column: 2; grid-row: 1 / span 20; position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
}
.side .path .step { grid-template-columns: 64px minmax(0, 1fr) auto; }
.side .path .pu { width: 34px; height: 36px; }
.pills { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; font-size: 13.5px; }
.pills span { padding: 5px 14px; color: var(--dim); }
.pills span + span { border-left: 1px solid var(--line); }
.pills b { color: var(--ink); margin-left: 6px; }
.headline { display: flex; align-items: center; gap: 12px; margin: 6px 0 12px; font: 400 clamp(30px, 3.4vw, 46px)/1 var(--display); text-transform: uppercase; }
.headline .y { color: var(--yellow); }
.views { display: flex; gap: 0; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: max-content; max-width: 100%; }
.views button { height: 36px; padding: 0 18px; font-size: 14px; font-weight: 800; color: var(--dim); }
.views button + button { border-left: 1px solid var(--line); }
.views button[aria-selected="true"] { background: var(--yellow); color: #111; }
.main.best-view .side, .main.best-view .stale-note { display: none !important; }
.lvrow[data-l="8"] { --tc: #3aa0ff; --t1: #1f6fd1; --t2: #57b4ff; }
.lvrow[data-l="9"] { --tc: #b56bff; --t1: #7b3fe0; --t2: #c98bff; }
.lvrow[data-l="10"] { --tc: #ffc808; --t1: #f29d00; --t2: #ffd84a; }
.lvrow .tblock b { color: rgba(0, 0, 0, .62); }
/* Số thứ hạng 1–4: màu huy chương */
.trow[data-t="1"] { --tc: #ffc808; --t1: #f2a900; --t2: #ffe066; }
.trow[data-t="2"] { --tc: #cfd8e3; --t1: #9aa6b2; --t2: #e8eef4; }
.trow[data-t="3"] { --tc: #e08a4a; --t1: #b8642b; --t2: #f0a46a; }
.trow[data-t="4"] { --tc: #6fa3c7; --t1: #4a7a9c; --t2: #8fbcdb; }
.cicon .tl[data-t="1"] { --l1: #f2a900; --l2: #ffe066; color: #111; } .cicon .tl[data-t="2"] { --l1: #9aa6b2; --l2: #eef3f8; color: #111; }
.cicon .tl[data-t="3"] { --l1: #b8642b; --l2: #f0a46a; color: #111; } .cicon .tl[data-t="4"] { --l1: #4a7a9c; --l2: #8fbcdb; color: #fff; }
.cicon .tl { width: 24px; height: 24px; font-size: 13px; }
.headline svg { width: 20px; height: 20px; fill: var(--yellow); }

/* --- Hàng tier: mỗi đội là một icon lục giác --- */
.tiers { display: grid; gap: 10px; }
.trow { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; --tc: var(--g2); }
.trow[data-t="S"] { --tc: var(--s2); --t1: var(--s1); --t2: var(--s2); }
.trow[data-t="A"] { --tc: var(--a2); --t1: var(--a1); --t2: var(--a2); }
.trow[data-t="B"] { --tc: var(--b2); --t1: var(--b1); --t2: var(--b2); }
.trow[data-t="C"] { --tc: var(--cc2); --t1: var(--cc1); --t2: var(--cc2); }
.trow[data-t="X"] { --tc: var(--x2); --t1: var(--x1); --t2: var(--x2); }
.trow[data-t="G"] { --tc: var(--g2); --t1: var(--g1); --t2: var(--g2); }
.tblock { position: relative; min-height: 104px; display: grid; place-items: center; align-content: center; background: linear-gradient(0deg, var(--t1, var(--g1)), var(--t2, var(--g2))); }
.tblock b { font: 400 66px/0.85 var(--heavy); color: rgba(0, 0, 0, .62); }
.tblock small { font-size: 11px; font-weight: 900; color: rgba(0, 0, 0, .55); text-transform: uppercase; margin-top: 6px; }
.tblock::before, .tblock::after { content: ""; position: absolute; width: 10px; height: 10px; border: 2.5px solid rgba(0, 0, 0, .6); }
.tblock::before { top: 6px; left: 6px; border-right: 0; border-bottom: 0; }
.tblock::after { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }
.trow[data-t="G"] .tblock b { font: 400 30px/1 var(--display); text-transform: uppercase; }
.tbox { contain: layout; position: relative; border: 2px solid var(--tc); border-radius: 18px; padding: 14px 16px; display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; background: var(--bg-2); }
.tbox .flag { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: var(--tc); color: #111; font-size: 11.5px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; padding: 3px 14px; border-radius: 999px; }
.cicon { position: relative; width: 74px; height: 74px; }
.cicon .ring { position: absolute; inset: 0; clip-path: var(--hex); background: var(--c1); transition: transform .12s; }
.cicon .ring img { position: absolute; inset: 0; margin: auto; width: 84%; height: 84%; clip-path: var(--hex); object-fit: cover; }
.cicon[data-c="2"] .ring { background: var(--c2); } .cicon[data-c="3"] .ring { background: var(--c3); }
.cicon[data-c="4"] .ring { background: var(--c4); } .cicon[data-c="5"] .ring { background: var(--c5); }
.cicon .tl { position: absolute; z-index: 2; top: 4px; left: 4px; width: 20px; height: 20px; display: grid; place-items: center; font: 900 12px/1 var(--body); color: #111; background: linear-gradient(0deg, var(--l1, var(--g1)), var(--l2, var(--g2))); clip-path: var(--hex); }
.cicon .tl[data-t="S"] { --l1: var(--s1); --l2: var(--s2); color: #fff; } .cicon .tl[data-t="A"] { --l1: var(--a1); --l2: var(--a2); }
.cicon .tl[data-t="B"] { --l1: var(--b1); --l2: var(--b2); } .cicon .tl[data-t="C"] { --l1: var(--cc1); --l2: var(--cc2); }

@container (max-width: 430px) { .hexboard .c .u .nm { display: none; } }

/* ô lục giác vẽ ở lớp nền (::before) để ấn/trang bị của tướng được tràn ra ngoài ô, nổi lên trên như Academy */

.hexboard .c .u .its { top: calc(var(--h) * .78); width: var(--w); z-index: 5; gap: 2px; } .hexboard .c .u .its img { width: var(--it); height: var(--it); margin: 0; border-radius: 4px; box-shadow: 0 0 0 1.5px #000, 0 3px 6px rgba(0, 0, 0, .7); }

.hexboard .c.over::before { background: color-mix(in srgb, var(--yellow) 35%, var(--cell)); }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; opacity: .92; will-change: transform; margin: 0 !important; padding: 0 !important; transition: none !important; }
.drag-ghost .c::before { display: none; }
.u.dragging { opacity: .35; }
.boxh { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 12px; position: relative; }
.boxh h4 { margin: 0 !important; }
.reset { position: absolute; right: 0; font-size: 12px; font-weight: 800; color: var(--dim); }
.reset:hover { color: var(--yellow); }
.zbtn { position: absolute; left: 0; height: 26px; font-size: 12px; }
.boxh .reset { right: 0; }
.alts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 20px; }
.alt { display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 12px; color: var(--dim); }

.alt svg { width: 12px; height: 12px; fill: var(--dim); }
.loading { display: flex; align-items: center; gap: 12px; color: var(--dim); background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; font-weight: 700; }

@keyframes spin { to { transform: rotate(360deg); } }

<script>
(function () {
  const D = window.TFT_DATA;
  const M = window.TFT_META || {};
  const solver = window.createSolver(D, M);
  const MAX = 4, MAX_UNITS = 4, MAX_BANS = 12;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (n) => Number(n).toLocaleString('vi-VN');
  const icon = (id) => `<svg aria-hidden="true"><use href="#i-${id}"/></svg>`;
  const short = (e) => e.name.replace(/^Ấn\s+/, '');
  const baseName = (u) => D.units[u].name.replace(/\s*\(.+\)$/, '');
  const emblemOfTrait = new Map(D.emblems.map((e) => [e.trait, e]));
  const emblemById = new Map(D.emblems.map((e) => [e.id, e]));
  const pickable = D.units.map((u, i) => i).filter((i) => !D.units[i].base)
    .sort((a, b) => D.units[a].cost - D.units[b].cost || D.units[a].name.localeCompare(D.units[b].name, 'vi'));

  const sample = ['Ấn Đao Phủ'].map((n) => D.emblems.findIndex((e) => e.name === n)).filter((i) => i >= 0);
  const state = { view: 'emblem', groups: [], picked: sample, locked: [], banned: [], carry: null, dmg: '', maxUnused: 3, maxUnique: null, unitMode: 'want', cost: 5, level: 9, run: 0, list: [], sel: 0, loading: false, pos: new Map() };
  try {
    const saved = JSON.parse(localStorage.getItem('tft-emblems') || 'null');
    if (saved && Array.isArray(saved.picked)) {
      state.picked = saved.picked.filter((i) => D.emblems[i]).slice(0, MAX);
      if ([7, 8, 9, 10].includes(saved.level)) state.level = saved.level;
      if (Array.isArray(saved.locked)) state.locked = saved.locked.filter((i) => D.units[i] && !D.units[i].base).slice(0, MAX_UNITS);
      if (Array.isArray(saved.banned)) state.banned = saved.banned.filter((i) => D.units[i] && !D.units[i].base).slice(0, MAX_BANS);
      if (saved.carry != null && D.units[saved.carry] && !D.units[saved.carry].base) state.carry = saved.carry;
      if (['', 'AD', 'AP'].includes(saved.dmg)) state.dmg = saved.dmg;
      if ('maxUnused' in saved) state.maxUnused = saved.maxUnused;
      // v2: mặc định 'Bất kỳ' (giới hạn 3 cũ loại mất đội mạnh: tướng 5 vàng hầu hết có tộc/hệ độc nhất)
      if ('maxUnique' in saved && saved.v === 2) state.maxUnique = saved.maxUnique;
      if (saved.view === 'best') state.view = 'best';
    }
  } catch (e) {}
  const save = () => { try { localStorage.setItem('tft-emblems', JSON.stringify({ v: 2, view: state.view, picked: state.picked, locked: state.locked, banned: state.banned, carry: state.carry, dmg: state.dmg, maxUnused: state.maxUnused, maxUnique: state.maxUnique, level: state.level })); } catch (e) {} };

  const sm = M.sources?.stats || M.sources?.seemeta;
  $('pills').innerHTML = `<span>Bản<b>${esc(M.patch || '?')}</b></span><span>Mùa<b>${D.set}</b></span>` + (sm ? `<span title="${esc(sm.name + (sm.patch ? ' · bản ' + sm.patch : ''))}">Số liệu<b>${fmt(sm.matches)} trận</b></span>` : '');
  $('src').textContent = 'Trang do người chơi làm, không liên kết với Riot Games.';
  const emblemStat = (e) => M.emblems?.[D.traits[e.trait].id];
  // Đánh giá ấn của app (tools/emblem-tiers.cjs): hạng + lời khuyên
  const ET = window.TFT_EMBLEM_TIERS || {};
  const VERDICT = { ngon: 'Ngon, dùng ngay', 'tinh-huong': 'Tình huống: chỉ dùng khi đội có sẵn tộc/hệ này', 'dap-lai': 'Nên đập lại bằng Búa Rèn' };
  const unitName = (id) => D.units.find((u) => u.id === id)?.name || id;

  // ---------------- Cột trái ----------------
  function renderPicker() {
    const slots = [];
    for (let i = 0; i < MAX; i++) {
      const e = D.emblems[state.picked[i]];
      slots.push(e ? `<button type="button" class="slot on" data-i="${i}" title="Bỏ ${esc(e.name)}"><img src="${e.img}" alt="${esc(e.name)}"></button>`
        : `<div class="slot" aria-hidden="true">${icon('plus')}</div>`);
    }
    $('slots').innerHTML = slots.join('');
    $('mini').innerHTML = state.picked.map((i) => `<img src="${D.emblems[i].img}" alt="${esc(D.emblems[i].name)}">`).join('')
      + state.locked.map((u) => `<img src="${D.units[u].img}" alt="${esc(D.units[u].name)}" style="border-radius:50%">`).join('')
      + `<span>Cấp ${state.level}</span>`;
    $('levels').innerHTML = [7, 8, 9, 10].map((l) => `<button type="button" data-l="${l}" aria-pressed="${l === state.level}">Cấp ${l}</button>`).join('');
    const full = state.picked.length >= MAX;
    $('emblems').innerHTML = D.emblems.map((e, i) => {
      const n = state.picked.filter((p) => p === i).length;
      const et = ET[e.id] || {};
      const st = { tier: et.tier };
      return `<button type="button" class="emb${n ? ' sel' : ''}${et.verdict === 'dap-lai' ? ' weak' : ''}" data-i="${i}" data-e="${e.trait}" ${full ? 'disabled' : ''}>
        ${n ? `<span class="cnt">×${n}</span>` : ''}${st?.tier ? `<span class="tier" data-t="${st.tier}">${st.tier}</span>` : ''}
        <span class="hx"><img src="${e.img}" alt="" loading="lazy" decoding="async"></span><span class="nm">${esc(short(e))}</span></button>`;
    }).join('');
  }

  function renderUnits() {
    const want = [];
    for (let i = 0; i < MAX_UNITS; i++) {
      const u = state.locked[i];
      want.push(u != null ? `<button type="button" class="slot on" data-i="${i}" title="Bỏ ${esc(D.units[u].name)}"><img src="${D.units[u].img}" alt="${esc(D.units[u].name)}"></button>`
        : `<div class="slot" aria-hidden="true">${icon('plus')}</div>`);
    }
    $('want').innerHTML = want.join('');
    $('bans').innerHTML = state.banned.length
      ? state.banned.map((u, i) => `<button type="button" class="b" data-i="${i}" title="Bỏ loại trừ ${esc(D.units[u].name)}"><img src="${D.units[u].img}" alt="${esc(D.units[u].name)}"></button>`).join('')
      : '<span class="empty">Chưa loại trừ tướng nào</span>';
    const cu = state.carry;
    $('carry').innerHTML = cu != null
      ? `<button type="button" class="slot on" id="carry-slot" title="Bỏ ${esc(D.units[cu].name)}"><img src="${D.units[cu].img}" alt="${esc(D.units[cu].name)}"></button><span class="hint">${esc(D.units[cu].name)}</span>`
      : '<div class="slot" aria-hidden="true">' + icon('plus') + '</div><span class="hint">Chọn ở tab Tướng → Carry</span>';
    const seg = (id, items, cur) => { $(id).innerHTML = items.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${String(v) === String(cur)}">${l}</button>`).join(''); };
    seg('opt-dmg', [['', 'Tự do'], ['AD', 'AD'], ['AP', 'AP']], state.dmg);
    const caps = [[1, '1'], [2, '2'], [3, '3'], [4, '4'], ['', 'Bất kỳ']];
    seg('opt-unused', caps, state.maxUnused ?? '');
    seg('opt-unique', caps, state.maxUnique ?? '');
    $('m-carry').setAttribute('aria-pressed', state.unitMode === 'carry');
    $('m-want').setAttribute('aria-pressed', state.unitMode === 'want');
    $('m-ban').setAttribute('aria-pressed', state.unitMode === 'ban');
    const q = $('q').value.trim().toLowerCase();
    $('costs').innerHTML = [1, 2, 3, 4, 5].map((c) => `<button type="button" data-c="${c}" aria-pressed="${!q && c === state.cost}"><i></i>${c}</button>`).join('');
    const full = state.unitMode === 'want' ? state.locked.length >= MAX_UNITS : state.unitMode === 'ban' ? state.banned.length >= MAX_BANS : false;
    $('units').innerHTML = pickable.filter((i) => q ? (D.units[i].name.toLowerCase().includes(q) || D.units[i].en.toLowerCase().includes(q)) : D.units[i].cost === state.cost).sort((a, b) => D.units[b].cost - D.units[a].cost).map((i) => {
      const u = D.units[i];
      const sel = state.locked.includes(i), ban = state.banned.includes(i), isCarry = state.carry === i;
      const st = M.units?.[u.id];
      return `<button type="button" class="upick${sel ? ' sel' : ''}${ban ? ' ban' : ''}${isCarry ? ' carry' : ''}" data-u="${i}" data-c="${u.cost}" ${full && !sel && !ban ? 'disabled' : ''}>
        <span class="hx"><img src="${u.img}" alt="" loading="lazy" decoding="async"></span><span class="nm">${esc(u.name)}</span></button>`;
    }).join('') || '<p class="none" style="grid-column:1/-1">Không thấy tướng.</p>';
  }

  // Tộc/hệ đặt tên đội: nhiều tướng nhất, rồi màu mốc cao hơn (vàng > bạc > đồng), rồi điểm số liệu
  const bpStyle = (t) => D.traits[t.trait].bps.filter(([m]) => m <= t.count).pop()?.[1] || 0;
  const topTrait = (c) => c.traits.filter((t) => t.active && D.traits[t.trait].kind !== 'unique')
    .sort((x, y) => y.count - x.count || bpStyle(y) - bpStyle(x) || (y.value || 0) - (x.value || 0))[0];

  // ---------------- Kết quả ----------------
  // Đội gợi ý: tên do app đặt (mốc mạnh nhất + carry), hạng S/A/B/C theo đánh giá của app.
  function fromRec(c) {
    const byId = c.frame ? new Map(c.frame.board.map((b) => [b.id, b])) : new Map();
    const top = topTrait(c);
    const carry = c.carries.slice(0, 2).map(baseName).join(' ');
    return {
      tier: c.tier, rating: c.rating, pct: c.pct, bestInSet: c.bestInSet, level: c.level, total: c.total, top: c.top,
      title: [top ? `${top.count} ${D.traits[top.trait].name}` : '', carry].filter(Boolean).join(' · ') || 'Đội hình',
      units: c.units, carries: c.carries, traits: c.traits, emblems: c.emblems,
      board: (u) => byId.get(D.units[u].id) || byId.get(D.units[u].base),
      positioned: !!c.frame,
    };
  }

  // Ảnh đại diện đội: tướng đắt nhất; cùng giá thì ưu tiên carry (theo thứ tự carry), rồi tướng không phải tank
  const avatarOrder = (c) => {
    const rank = (u) => { const i = c.carries.indexOf(u); return i < 0 ? 99 : i; };
    return c.units.slice().sort((a, b) => D.units[b].cost - D.units[a].cost || rank(a) - rank(b)
      || (D.units[a].tank ? 1 : 0) - (D.units[b].tank ? 1 : 0));
  };
  const mainCarry = (c) => c.avatar ?? avatarOrder(c)[0];
  // Chọn ảnh đại diện cho cả danh sách: tướng đắt nhất (ưu tiên carry); tướng đã làm đại diện cho đội trước thì đội sau chọn tướng khác (Lux vẫn được dùng, chỉ không lặp lại)
  function assignAvatars(list) {
    const used = new Set();
    const key = (u) => D.units[u].base || D.units[u].id;
    for (const c of list) {
      const order = avatarOrder(c);
      const top = D.units[order[0]].cost;
      const pick = order.find((u) => D.units[u].cost >= top - 1 && !used.has(key(u)))
        || order.find((u) => !used.has(key(u))) || order[0];
      c.avatar = pick;
      used.add(key(pick));
    }
    return list;
  };


  function compIcon(c, i, g = [i]) {
    const u = mainCarry(c);
    const stack = g.slice(1).map((k, n) => `<span class="stk" style="--n:${n + 1}"><img src="${D.units[mainCarry(state.list[k])].img}" alt=""></span>`).reverse().join('');
    const tt = topTrait(c);
    const ems = c.emblems.filter((e) => e.unit === u);
    const badge = ems.length ? null : tt ? D.traits[tt.trait].img : null;
    return `<button type="button" class="cicon" data-k="${i}" data-c="${D.units[u].cost}" aria-pressed="${g.includes(state.sel)}" title="${esc(c.title + (c.rating != null ? ` · ${c.rating} điểm` : '') + (g.length > 1 ? ` · ${g.length} bản` : ''))}">
      ${stack}<span class="ring"><img src="${D.units[u].img}" alt="${esc(D.units[u].name)}"></span>
      <span class="tl" data-t="${c.tier}">${c.tier}</span>
      ${ems.length ? `<span class="ems">${ems.map((e) => `<img src="${emblemOfTrait.get(e.trait).img}" alt="">`).join('')}</span>` : badge ? `<span class="bd"><img src="${badge}" alt=""></span>` : ''}
    </button>`;
  }

  function renderTiers() {
    if (state.view === 'best') {
      $('tiers').innerHTML = [8, 9, 10].map((L) => {
        const gs = state.groups.filter((g) => state.list[g[0]].level === L);
        if (!gs.length) return '';
        return `<section class="trow lvrow" data-l="${L}"><div class="tblock"><b>${L}</b><small>Cấp ${L}</small></div>
          <div class="tbox">${gs.map((g) => compIcon(state.list[g[0]], g[0], g)).join('')}</div></section>`;
      }).join('') || '<div class="loading"><i></i>Đang tìm đội mạnh nhất…</div>';
      return;
    }
    $('tiers').innerHTML = ['S', 'A', 'B', 'C'].map((t) => {
      const gs = state.groups.filter((g) => state.list[g[0]].tier === t);
      if (!gs.length) return '';
      return `<section class="trow" data-t="${t}"><div class="tblock"><b>${t}</b><small>Hạng ${t}</small></div>
        <div class="tbox">${gs.map((g) => compIcon(state.list[g[0]], g[0], g)).join('')}</div></section>`;
    }).join('') || (state.loading ? '<div class="loading"><i></i>Đang tìm đội hình…</div>'
      : (state.picked.length || state.locked.length || state.carry != null ? '<p class="none">Không tìm được đội phù hợp. Thử nới giới hạn ở mục Tùy chọn hoặc bỏ bớt tướng muốn có.</p>' : '<p class="none">Chọn ấn hoặc tướng ở cột bên trái rồi bấm “Tìm đội hình”.</p>'));
  }

  // Như trang xếp đội của TFT Academy: mốc đang kích tô màu, xếp cầu vồng > vàng > độc nhất (cam) > bạc > đồng;
  // sau đó là mốc chưa kích (xám, ghi số/mốc kế tiếp, vd 1/2).
  const STYLE_RANK = { 6: 5, 5: 4, 4: 3, 3: 2, 1: 1 };
  function traitsHtml(c) {
    const isUniq = (t) => D.traits[t.trait].kind === 'unique' || t.style === 4;
    const on = c.traits.filter((t) => t.count > 0 && (t.active || isUniq(t)))
      .map((t) => ({ ...t, s: isUniq(t) ? 4 : t.style }))
      .sort((x, y) => (STYLE_RANK[y.s] || 0) - (STYLE_RANK[x.s] || 0) || y.count - x.count);
    const off = c.traits.filter((t) => t.count > 0 && !t.active && !isUniq(t)).sort((x, y) => y.count - x.count);
    const chip = (t, off) => {
      const tr = D.traits[t.trait];
      const next = tr.bps.find(([m]) => m > t.count)?.[0];
      const label = off && next ? `${t.count}<small>/${next}</small>` : t.count;
      const tip = `${t.count} ${tr.name}` + (off && next ? ` · chưa kích (cần ${next})` : '') + (t.s === 4 ? ' · tộc/hệ độc nhất' : '') + (t.games ? ` · ${fmt(t.games)} ván` : '');
      return `<button type="button" class="trait${off ? ' off' : ''}" data-s="${off ? 0 : t.s}" data-tr="${t.trait}" data-n="${t.count}" title="${esc(tip)}" aria-haspopup="dialog"><img src="${tr.img}" alt="${esc(tr.name)}"><span>${label}</span></button>`;
    };
    return on.map((t) => chip(t, false)).join('') + off.map((t) => chip(t, true)).join('');
  }

  // Popup khi bấm vào một tộc/hệ: mô tả, mốc đang đạt (đậm), danh sách tướng có tộc/hệ đó
  function traitPopup(ti, n, anchor) {
    const comp = anchor.closest('#detail, #zoom') ? state.list[state.sel] : null;
    const have = new Set((comp?.units || []).map((u) => D.units[u].base || D.units[u].id));
    const inComp = (i) => !comp || have.has(D.units[i].base || D.units[i].id) || have.has(D.units[i].id);
    closeTraitPopup();
    const tr = D.traits[ti];
    const cur = tr.bps.filter(([m]) => m <= n).pop()?.[0];
    const rows = (tr.rows || []).map((r) => `<span class="r${r.min === cur ? ' on' : ''}">${esc(r.text)}</span>`).join('');
    const byEmblem = new Set((comp?.emblems || []).filter((e) => e.trait === ti && e.unit != null).map((e) => e.unit));
    const units = D.units.map((u, i) => i).filter((i) => !D.units[i].hidden && (D.units[i].traits.includes(ti) || byEmblem.has(i)))
      .sort((a, b) => D.units[a].cost - D.units[b].cost || D.units[a].name.localeCompare(D.units[b].name));
    const el = document.createElement('div');
    el.className = 'tpop'; el.id = 'tpop'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', tr.name);
    el.innerHTML = `<div class="hd"><img src="${tr.img}" alt=""><b>${esc(tr.name)}</b></div>
      <div class="ds">${tr.desc ? `<span class="in">${esc(tr.desc)}</span>` : ''}${rows}</div>
      ${units.length ? `<div class="us">${units.map((i) => `<span class="uw"><img src="${D.units[i].img}" data-c="${D.units[i].cost}"${inComp(i) ? '' : ' class="off"'} alt="${esc(D.units[i].name)}" title="${esc(D.units[i].name)} · ${D.units[i].cost} vàng${byEmblem.has(i) ? ' · cầm ấn' : ''}">${byEmblem.has(i) ? `<img class="eb" src="${emblemOfTrait.get(ti).img}" alt="">` : ''}</span>`).join('')}</div>` : ''}`;
    document.body.appendChild(el);
    const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
    let x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8);
    let y = r.bottom + 8;
    if (y + h > innerHeight - 8) y = Math.max(8, r.top - h - 8);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    anchor.setAttribute('aria-expanded', 'true');
    popScroll = scrollY;
  }
  let popScroll = 0;
  function closeTraitPopup() {
    document.getElementById('tpop')?.remove();
    document.querySelectorAll('.trait[aria-expanded]').forEach((b) => b.removeAttribute('aria-expanded'));
  }
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('button.trait');
    if (b) {
      // đang hiện do di chuột thì bấm để ghim lại; đã ghim thì bấm để đóng
      const open = b.getAttribute('aria-expanded') === 'true';
      if (open && b.dataset.pinned === '1') { delete b.dataset.pinned; closeTraitPopup(); }
      else { if (!open) traitPopup(+b.dataset.tr, +b.dataset.n, b); b.dataset.pinned = '1'; }
      return;
    }
    if (!ev.target.closest('#tpop')) closeTraitPopup();
  });
  document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeTraitPopup(); });
  // Cuộn trang xa hơn một chút thì đóng popup
  window.addEventListener('scroll', () => { if (Math.abs(scrollY - popScroll) > 40) closeTraitPopup(); }, { passive: true });
  window.addEventListener('resize', closeTraitPopup);

  function unitCell(u, c) {
    const unit = D.units[u];
    // Chỉ hiện ấn người chơi có (không hiện trang bị của đội mẫu)
    const items = [];
    const mine = [];
    for (const e of c.emblems.filter((x) => x.unit === u)) {
      const em = emblemOfTrait.get(e.trait);
      mine.push(`<img class="mine" src="${em.img}" alt="" data-e="${e.trait}">`);
    }
    const vt = unit.base && unit.extra?.[0] ? D.traits[unit.extra[0][0]] : null;
    const want = state.locked.some((w) => w === u || D.units[w].id === unit.base);
    return `<div class="u${want ? ' want' : ''}" data-u="${u}" data-c="${unit.cost}">
      <span class="ring"><img src="${unit.img}" alt="${esc(unit.name)}" loading="lazy" decoding="async"></span>
      ${vt ? `<span class="vt"><img src="${vt.img}" alt=""></span>` : ''}${unit.slots > 1 ? '<span class="w2">2 ô</span>' : ''}
      <span class="nm">${esc(baseName(u))}</span><span class="its">${mine.concat(items).slice(0, 3).join('')}</span>
    </div>`;
  }

  // Bàn cờ 4 hàng × 7 ô. Đội TFT Academy dùng đúng vị trí của họ; đội khác tự xếp: tank hàng trên, còn lại hàng dưới.
  const compKey = (c) => c.kind + '|' + c.title + '|' + c.units.join(',');
  function boardCells(c) {
    const saved = state.pos.get(compKey(c));
    if (saved) return saved.slice();
    const cells = new Array(28).fill(null);
    if (c.positioned) {
      // Giữ vị trí của đội mẫu nếu đúng hàng theo luật tầm đánh
      for (const u of c.units) { const b = c.board(u); if (b?.hex != null && b.hex < 28 && !cells[b.hex] && Math.floor(b.hex / 7) === rowOf(u)) cells[b.hex] = u; }
    }
    // Tướng chưa có vị trí: đặt vào ô gần nhất với vị trí quen thuộc của tướng đó trong các đội TFT Academy
    const left = c.units.filter((u) => !cells.includes(u))
      .map((u) => ({ u, ...posPref(u) }))
      .sort((a, b) => b.n - a.n); // tướng có nhiều dữ liệu vị trí xếp trước
    for (const p of left) {
      let best = -1, bestD = Infinity;
      for (let k = 0; k < 28; k++) {
        if (cells[k] != null) continue;
        const d = 3 * Math.abs(Math.floor(k / 7) - p.row) + Math.abs((k % 7) - p.col);
        if (d < bestD) { bestD = d; best = k; }
      }
      if (best >= 0) cells[best] = p.u;
    }
    return cells;
  }
  // Vị trí quen thuộc của từng tướng (hàng hay đứng nhất, cột trung bình) học từ các đội TFT Academy.
  // Chưa có dữ liệu thì theo vai trò: tank hàng đầu, đánh gần hàng 2, đánh xa hàng cuối.
  const POS = (() => {
    const m = new Map();
    for (const c of M.comps || []) for (const b of c.board || []) {
      if (b.hex == null || b.hex >= 28) continue;
      if (!m.has(b.id)) m.set(b.id, { rows: [0, 0, 0, 0], cols: [] });
      const s = m.get(b.id);
      s.rows[Math.floor(b.hex / 7)]++;
      s.cols.push(b.hex % 7);
    }
    return m;
  })();
  // Hàng theo tầm đánh: tank / cận chiến (tầm 1) hàng 1, tầm 2 hàng 2 (vd Kennen), tầm xa hàng cuối.
  // Ngoại lệ: tướng tầm 2 nhưng đánh tay đôi ở tuyến đầu (Gnar, Rồng Cổ Đại).
  const FRONT_RANGE2 = new Set(['Gnar', 'Elder Dragon']);
  function rowOf(u) {
    const unit = D.units[u];
    const r = unit.range || 1;
    if (unit.tank || r <= 1 || FRONT_RANGE2.has(unit.en)) return 0;
    return r === 2 ? 1 : 3;
  }
  function posPref(u) {
    const unit = D.units[u];
    const s = POS.get(unit.id) || POS.get(unit.base);
    const row = rowOf(u);
    if (s && s.cols.length) {
      const col = Math.round(s.cols.reduce((a, b) => a + b, 0) / s.cols.length);
      return { row, col, n: s.cols.length };
    }
    return { row, col: 3, n: 0 };
  }
  function boardHtml(c) {
    const cells = boardCells(c);
    let html = '';
    for (let r = 0; r < 4; r++) {
      html += '<div class="r">';
      for (let k = 0; k < 7; k++) { const p = r * 7 + k; const u = cells[p]; html += `<div class="c" data-p="${p}">${u != null ? unitCell(u, c) : ''}</div>`; }
      html += '</div>';
    }
    return `<div class="hexboard">${html}</div>`;
  }

  // Đội cấp 8 không dựa vào tướng 5 vàng; "Gặp tướng 5 vàng": gặp thì thay ai, đội mạnh lên bao nhiêu (kế hoạch viết sẵn)
  function up5Html(c) {
    if (c.level !== 8 || c.total == null) return '';
    const best = state.view === 'best';
    const ems = c.emblems.map((e) => e.trait);
    const ups = solver.upgrades5(c.units, ems, 8, { pure: best, locked: state.locked, banned: state.banned });
    if (!ups.length) return '';
    const q = best ? null : solver.scaleOf(8, ems.length);
    const pts = (g) => Math.round(best ? (100 * g) / (c.top || c.total) : q ? (100 * g) / Math.max(1, q[100] - q[0]) : g);
    const pu = (u) => `<span class="un"><span class="pu" data-c="${D.units[u].cost}" data-u="${u}"><img src="${D.units[u].img}" alt="${esc(D.units[u].name)}"></span><i>${esc(baseName(u))}</i></span>`;
    return `<div class="box up5"><h4 title="Gặp tướng 5 vàng thì thay ai">Flex Units</h4><div class="rows">${ups.map((x) => `<div class="r">
      <span class="out">${pu(x.remove)}</span><svg class="arr" viewBox="0 0 24 24"><path d="M7 3l12 9-12 9z"/></svg>${pu(x.add)}
      <b>+${pts(x.gain)}</b><small>điểm</small></div>`).join('')}</div></div>`;
  }
  function renderDetail() {
    const c = state.list[state.sel];
    if (!c) { $('detail').innerHTML = ''; return; }
    const carry = mainCarry(c);
    const em = c.emblems.find((e) => e.unit === carry);
    const t = c.tier;
    const holders = c.emblems.map((e) => {
      const emb = emblemOfTrait.get(e.trait);
      if (e.unit == null) return `<div class="holder bad"><img class="ei" src="${emb.img}" alt="" data-e="${e.trait}"><span></span><span></span><div><b>${esc(short(emb))}</b><small>Không có tướng cầm được</small></div></div>`;
      // Ấn không đẩy tộc/hệ lên mốc nào: nói rõ là cầm tạm lấy chỉ số, không cố kích
      const useless = !e.lifts;
      const sub = useless ? 'Không lên mốc · cầm tạm để lấy chỉ số'
        : (e.stats ? `TB ${e.stats.avg} · ${fmt(e.stats.games)} ván` : 'Chưa đủ số liệu');
      const gain = !useless && e.after !== e.before ? ` · ${e.before}→${e.after} ${D.traits[e.trait].name}` : '';
      return `<div class="holder"><img class="ei" src="${emb.img}" alt="" data-e="${e.trait}"><svg viewBox="0 0 24 24"><path d="M7 3l12 9-12 9z"/></svg>
        <img class="hp" src="${D.units[e.unit].img}" alt=""><div><b>${esc(D.units[e.unit].name)}</b><small>${esc(sub + gain)}</small></div></div>`;
    }).join('');
    const gold = c.units.reduce((a, u) => a + 3 * D.units[u].cost, 0);
    const chips = [`<span class="chip score" data-t="${t}" title="Điểm 0–100 so với đội mạnh nhất có thể ở cấp ${c.level} (mọi bộ ấn)${c.pct != null ? ` · mạnh hơn ${c.pct}% đội tốt nhất của các bộ ấn khác` : ''}">Điểm <b>${c.rating ?? '–'}</b>/100</span>`,
      ...(c.bestInSet && t !== 'S' ? ['<span class="chip" title="Bộ ấn này không mạnh, nhưng đây là đội tốt nhất có thể với nó">Tốt nhất cho bộ ấn này</span>'] : []),
      `<span class="chip">Cấp ${c.level}</span>`, `<span class="chip" title="Tổng vàng để có cả đội ở 2 sao (mỗi tướng 3 bản)">Tổng giá 2★: ${gold} vàng</span>`];
    const weak = [...new Set(c.emblems.filter((e) => e.unit == null || !e.lifts).map((e) => short(emblemOfTrait.get(e.trait))))];
    if (weak.length) chips.push(`<span class="chip warn">Ấn ${esc(weak.join(', '))} không lên mốc</span>`);
    $('detail').innerHTML = `<div class="detail trow" data-t="${t}">
      <aside class="hero">
        <span class="wm">${t}</span>
        <div class="big"><span class="ring"><img src="${D.units[carry].img}" alt="${esc(D.units[carry].name)}"></span>${em ? `<span class="em"><img src="${emblemOfTrait.get(em.trait).img}" alt=""></span>` : ''}</div>
        <h2>${esc(c.title)}</h2>
        <div class="traits">${traitsHtml(c)}</div>
        ${c.emblems.length ? `<h4>Ấn của bạn</h4><div class="holders">${holders}</div>` : ''}
      </aside>
      <div class="right">
        <div class="rhead">
          ${groupOf(state.sel).length > 1
            ? `<div class="vtabs" role="tablist">${groupOf(state.sel).map((k) => `<button type="button" class="ctab vtab" role="tab" data-v="${k}" data-t="${state.list[k].tier}" aria-selected="${k === state.sel}"><span class="tl">${state.list[k].tier}</span>${esc(state.list[k].title)}</button>`).join('')}</div>`
            : `<span class="ctab"><span class="tl">${t}</span>${esc(c.title)}</span>`}${chips.join('')}
          <div class="acts">
            <button type="button" class="pill y copy" data-code="${solver.teamCode(c.units)}">${icon('copy')}<span>Mã đội</span></button>
          </div>
        </div>
        <div class="box"><div class="board">${c.units.map((u) => unitCell(u, c)).join('')}</div></div>
        ${up5Html(c)}
        <div class="box" id="boardbox"><div class="boxh"><h4>Vị trí xếp</h4><button type="button" class="reset" id="reset-pos" ${state.pos.has(compKey(c)) ? '' : 'hidden'}>Đặt lại</button><button type="button" class="pill zbtn" id="zoom-open">Phóng to</button></div>${boardHtml(c)}</div>
      </div>
    </div>`;
  }

  async function compute() {
    const run = ++state.run;
    const traits = state.picked.map((i) => D.emblems[i].trait);
    const locked = state.locked.slice(), banned = state.banned.slice();
    state.sel = 0;
    state.loading = false;
    $('reforge').hidden = true;
    $('path').hidden = true;
    if (!traits.length && !locked.length && state.carry == null) { state.list = []; state.groups = []; renderTiers(); renderDetail(); return; }
    state.loading = true;
    $('go').disabled = true; $('go').textContent = 'Đang tìm…';
    state.list = []; state.groups = [];
    renderTiers(); renderDetail();
    const result = await solver.recommendAsync(traits, state.level, 14, (p) => {
      if (run === state.run) $('prog').style.width = Math.round((p.done / p.total) * 100) + '%';
    }, { locked, banned, carry: state.carry, dmg: state.dmg || null, maxUnused: state.maxUnused, maxUnique: state.maxUnique });
    if (run !== state.run) return;
    state.loading = false;
    $('go').disabled = false; $('go').textContent = 'Tìm đội hình';
    $('prog').style.width = '0';
    const grouped = groupComps(result);
    state.list = grouped.list.map(fromRec);
    state.groups = grouped.groups;
    assignAvatars(state.groups.map((g) => state.list[g[0]]));
    // các bản trong nhóm dùng chung ảnh đại diện với bản đầu nhóm nếu có tướng đó
    for (const g of state.groups) for (const i of g.slice(1)) { const a = state.list[g[0]].avatar; if (state.list[i].units.includes(a)) state.list[i].avatar = a; }
    renderTiers(); renderDetail();
    await runPlan(run, traits, { locked, banned, carry: state.carry, dmg: state.dmg || null, maxUnused: state.maxUnused, maxUnique: state.maxUnique });
    if (run !== state.run) return;
    runReforge(run, traits, { locked, banned, carry: state.carry, dmg: state.dmg || null, maxUnused: state.maxUnused, maxUnique: state.maxUnique });
  }

  // ---------------- Hai lối chơi: Lên 8 / Lên 9 ----------------
  // Hai con đường riêng (không phải hai chặng): Lên 8 = roll ở cấp 8 lấy bài thủ; Lên 9 = giữ kinh tế, chịu máu, lên 9 mới roll.
  const planCache = new Map();
  let planRes = null, planTab = 'up9';
  const tierOfPct = (p) => (p == null ? null : p >= 90 ? 'S' : p >= 65 ? 'A' : p >= 30 ? 'B' : 'C');
  async function runPlan(run, traits, opts) {
    const box = $('path');
    if (!traits.length) { box.hidden = true; return; }
    const key = JSON.stringify([traits, opts]);
    let res = planCache.get(key);
    if (!res) {
      box.hidden = false;
      box.innerHTML = `<div class="hd">Lối chơi: Lên 8 hay Lên 9 <small>Đang tính…</small></div><div class="pg"><i id="pathp"></i></div>`;
      await new Promise((r) => setTimeout(r, 50));
      if (run !== state.run) return;
      res = await solver.planAsync(traits, opts, (p) => { const el = document.getElementById('pathp'); if (el) el.style.width = Math.round(p * 100) + '%'; });
      if (run !== state.run) return;
      planCache.set(key, res);
    }
    planRes = res;
    planTab = res?.pick === 'up8' ? 'up8' : res?.up9 ? 'up9' : 'up8';
    renderPlan();
  }
  function renderPlan() {
    const box = $('path');
    const res = planRes;
    if (!res) { box.hidden = true; return; }
    box.hidden = false;
    const plan = res[planTab] || res.up8 || res.up9;
    const ems = (list) => list.map((t) => `<img src="${emblemOfTrait.get(t).img}" alt="" data-e="${t}">`).join('');
    const titles = planTab === 'up8' ? ['Cấp 8', 'Lên 9'] : ['Chịu máu', 'Cấp 9', 'Cấp 10'];
    const pu = (u, cls = '') => `<span class="pu${cls}" data-c="${D.units[u].cost}" data-u="${u}"><img src="${D.units[u].img}" alt="${esc(D.units[u].name)}"></span>`;
    const steps = plan.steps.map((st, i) => {
      const added = new Set(st.added);
      const isMain = st === plan.main;
      const units = st.units.slice().sort((a, b) => added.has(a) - added.has(b) || D.units[b].cost - D.units[a].cost);
      const notes = [];
      if (st.removed.length) notes.push(`<span class="nt"><i>Bán</i>${st.removed.map((u) => pu(u, ' sm sold')).join('')}</span>`);
      // Ấn tháo ra được: ghi ấn gắn mới, hoặc chuyển sang người khác so với bước trước
      const prevFx = i ? plan.steps[i - 1].fixed : null;
      const moved = st.emblems.filter((e) => e.unit != null && (!prevFx || prevFx.get(e.trait) !== e.unit));
      if (moved.length) notes.push(`<span class="nt"><i>Ấn</i>${moved.map((e) => `<span class="mv">${ems([e.trait])}${pu(e.unit, ' sm')}</span>`).join('')}</span>`);
      const t = isMain ? tierOfPct(st.pct) : null;
      const tag = isMain ? `<span class="tl" data-t="${t || 'C'}">${t || '–'}</span><small>${Math.max(0, Math.min(100, Math.round(st.rating)))}đ</small>` : '';
      return `<div class="step${isMain ? ' main' : ''}">
        <div class="lv"><b>${esc(titles[i])}</b>${tag}</div>
        <div class="us">${units.map((u) => pu(u, added.has(u) ? ' new' : '')).join('')}</div>
        <button type="button" class="pill y copy" data-code="${solver.teamCode(st.units)}">${icon('copy')}<span>Mã</span></button>
        ${notes.length ? `<div class="note">${notes.join('')}</div>` : ''}
      </div>`;
    }).join('');
    const rec = (k) => res.pick === k ? ' <em class="rec">Nên chọn</em>' : '';
    const tabs = `<div class="tabs" role="tablist">
      ${res.up8 ? `<button type="button" role="tab" data-pt="up8" aria-selected="${planTab === 'up8'}">Lên 8${rec('up8')}</button>` : ''}
      ${res.up9 ? `<button type="button" role="tab" data-pt="up9" aria-selected="${planTab === 'up9'}">Lên 9${rec('up9')}</button>` : ''}</div>`;
    // Nên bắt sớm: tướng của đội về sau chưa có ở bước đầu — gặp thì mua giữ hàng chờ
    const first = new Set(plan.steps[0].units.map((u) => D.units[u].base || D.units[u].id));
    const later = [...new Set(plan.steps.slice(1).flatMap((st) => st.units))].filter((u) => !first.has(D.units[u].base || D.units[u].id))
      .sort((a, b) => D.units[b].cost - D.units[a].cost);
    const hold = later.length ? `<div class="hold"><b>Nên bắt sớm</b><div class="us">${later.map((u) => pu(u)).join('')}</div></div>` : '';
    box.innerHTML = `<div class="hd">Lối chơi</div>${tabs}${hold}<div class="steps">${steps}</div>`;
  }
  $('path').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-pt]');
    if (!b || b.dataset.pt === planTab) return;
    planTab = b.dataset.pt;
    renderPlan();
  });

  // ---------------- Gợi ý đập ấn (Búa Rèn) ----------------
  // Chỉ dùng cho đầu game (còn đổi đội tự do): so với đội mạnh nhất có thể sau khi đập.
  // Cuối game đã bỏ: khi giữ đội cố định thì gần như luôn khuyên giữ, không có ích.
  const reforgeCache = new Map();
  let rfCtx = null; // { run, traits, opts }
  function runReforge(run, traits, opts) {
    rfCtx = { run, traits, opts };
    updateReforge();
  }
  async function updateReforge() {
    const box = $('reforge');
    const ctx = rfCtx;
    if (!ctx || !ctx.traits.length || ctx.run !== state.run || !state.list.length) { box.hidden = true; return; }
    box.hidden = false;
    const key = JSON.stringify([ctx.traits, state.level, ctx.opts]);
    let res = reforgeCache.get(key);
    if (!res) {
      box.innerHTML = `<div class="hd">Có nên đập ấn? <small>Đang thử đập từng ấn…</small></div><div class="pg"><i id="rfp"></i></div>`;
      await new Promise((r) => setTimeout(r, 200));
      if (rfCtx !== ctx || ctx.run !== state.run) return;
      res = await solver.reforgeAdvice(ctx.traits, state.level, ctx.opts,
        (p) => { const el = document.getElementById('rfp'); if (el) el.style.width = Math.round(p * 100) + '%'; },
        () => rfCtx !== ctx || ctx.run !== state.run);
      if (!res) return;
      reforgeCache.set(key, res);
      if (rfCtx !== ctx) return;
    }
    renderReforge(res);
  }
  // Đổi chênh lệch điểm thô sang thang 0–100 đang hiển thị
  const toScale = (x) => { const q = solver.scaleOf(state.level, state.picked.length); return q ? (x * 100) / Math.max(1, q[100] - q[0]) : x; };
  function renderReforge(res) {
    const box = $('reforge');
    const emb = (t) => emblemOfTrait.get(t);
    const nm = (t) => short(emb(t));
    const pts = (x) => Math.abs(Math.round(toScale(x)));
    const go = new Set(res.pick.idx);
    const head = go.size
      ? `Nên đập ấn ${res.pick.traits.map((t) => esc(nm(t))).join(' và ')}`
      : 'Giữ tất cả ấn';
    const sub = go.size
      ? `Đập xong, trung bình đội mạnh hơn khoảng ${pts(res.pick.gain)} điểm.`
      : 'Đập ấn nào cũng dễ ra ấn tệ hơn.';
    const rows = res.singles.map((x) => {
      const on = go.has(x.index);
      const why = on ? 'ấn này kéo đội yếu đi, đập ra ấn khác thường tốt hơn'
        : x.gain > 0 ? 'đập có thể tốt hơn chút ít, nhưng không đáng'
        : 'đang có ích, đập dễ ra ấn tệ hơn';
      return `<div class="it ${on ? 'go' : 'keep'}"><img src="${emb(x.trait).img}" alt="${esc(nm(x.trait))}"><span class="v">${on ? 'Đập' : 'Giữ'}</span><span class="tx"><b>${esc(nm(x.trait))}</b>: ${why}.</span></div>`;
    }).join('');
    const detail = res.singles.map((x) => `<li><b>${esc(nm(x.trait))}</b>: đập ra ấn khác thì trung bình ${x.gain >= 0 ? 'mạnh hơn' : 'yếu đi'} ${pts(x.gain)} điểm · ${x.better}/${x.of} ấn tốt hơn · đẹp nhất nếu ra ${x.best.map((t) => esc(nm(t))).join(', ')}</li>`).join('');
    box.innerHTML = `<div class="hd">${head} <small>${sub}</small></div><div class="list">${rows}</div>
      <details class="more"><summary>Xem số liệu</summary><ul>${detail}</ul></details>`;
  }

  // Hiện tối đa 4 NHÓM đội, mỗi nhóm tối đa 3 bản. Chung nhóm khi trùng "xương sống" với bản đầu nhóm:
  // ≥ 2 trong 3 carry chính và ≥ 2 trong 3 tank chính (tướng kích hệ còn lại được phép khác).
  // Nhóm xếp theo bản tốt nhất (ưu tiên hạng S, A, rồi B, C).
  const MAX_GROUPS = 4, MAX_VARIANTS = 3, VARIANT_GAP = 25, CORE_MIN = 2;
  function groupComps(list) {
    const order = ['S', 'A', 'B', 'C'];
    const sorted = list.slice()
      .sort((a, b) => (order.indexOf(a.tier) + 1 || 9) - (order.indexOf(b.tier) + 1 || 9) || (b.rating || 0) - (a.rating || 0));
    const key = (u) => D.units[u].base || D.units[u].id;
    const carries = (c) => c.carries.filter((u) => !D.units[u].tank).slice(0, 3).map(key);
    const tanks = (c) => c.units.filter((u) => D.units[u].tank).sort((a, b) => D.units[b].cost - D.units[a].cost).slice(0, 3).map(key);
    const overlap = (x, y) => x.filter((k) => y.includes(k)).length;
    const sameCore = (a, b) => overlap(carries(a), carries(b)) >= CORE_MIN && overlap(tanks(a), tanks(b)) >= CORE_MIN;
    const groups = [];
    for (const c of sorted) {
      const g = groups.find((gr) => sameCore(gr[0], c));
      // bản phụ phải đáng chơi: kém bản đầu nhóm không quá VARIANT_GAP điểm
      if (g) { if (g.length < MAX_VARIANTS && (c.rating ?? 0) >= (g[0].rating ?? 0) - VARIANT_GAP) g.push(c); continue; }
      if (groups.length < MAX_GROUPS) groups.push([c]);
    }
    const flat = groups.flat();
    return { list: flat, groups: groups.map((g) => g.map((c) => flat.indexOf(c))) };
  }
  const groupOf = (i) => state.groups.find((g) => g.includes(i)) || [i];

  // Đổi lựa chọn (ấn, cấp, tướng, tùy chọn): chỉ lưu và đánh dấu, chưa tính — bấm "Tìm đội hình" mới tính
  function refresh() { renderPicker(); renderUnits(); save(); setStale(true); }
  function setStale(on) {
    state.dirty = on;
    $('go').classList.toggle('pulse', on);
    $('stale').hidden = !on || !state.list.length;
    document.querySelector('.main').classList.toggle('stale', on && state.list.length > 0);
  }
  function search() {
    setStale(false);
    compute();
    if (innerWidth <= 900) setRail(false);
  }

  // ---------------- Sự kiện ----------------
  // ---------- Chế độ "Đội mạnh nhất · không ấn": tính sẵn trong web/best.js (thiếu thì tự tính) ----------
  const emblemView = { list: [], groups: [] };
  async function showBest() {
    const run = ++state.run;
    state.list = []; state.groups = []; state.sel = 0;
    renderTiers(); renderDetail();
    const levels = {};
    const pre = window.TFT_BEST?.levels;
    for (const L of [8, 9, 10]) {
      // điểm chỉ từ số liệu tướng + tộc/hệ (không cộng điểm "giống kiểu đội thật")
      levels[L] = pre?.[L]
        ? pre[L].map((c) => ({ units: c.units.map((id) => D.units.findIndex((u) => u.id === id)), total: c.total })).filter((c) => c.units.every((u) => u >= 0))
        : await solver.bestComps(L, 6);
      if (run !== state.run) return;
    }
    const list = [];
    for (const L of [8, 9, 10]) {
      const comps = levels[L].map((c) => ({ ...solver.evalComp(c.units, [], L), total: c.total, prior: null, level: L }));
      const top = Math.max(1, ...comps.map((c) => c.total));
      comps.sort((a, b) => b.total - a.total).slice(0, 4).forEach((c, k) => list.push({ ...c, tier: String(k + 1), rating: Math.round((100 * c.total) / top), pct: null, bestInSet: false, top }));
    }
    state.list = list.map(fromRec);
    state.groups = state.list.map((c, i) => [i]);
    assignAvatars(state.list);
    renderTiers(); renderDetail();
  }
  function viewUI(v) {
    state.view = v; save();
    document.querySelectorAll('.views [data-view]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === v)));
    document.querySelector('.main').classList.toggle('best-view', v === 'best');
    $('hl').textContent = v === 'best' ? 'Mạnh nhất' : 'Theo ấn';
  }
  function setView(v) {
    if (v === state.view && (v === 'best' ? state.list.length : true)) return;
    if (state.view === 'emblem') { emblemView.list = state.list; emblemView.groups = state.groups; emblemView.sel = state.sel; }
    viewUI(v);
    if (v === 'best') { setStale(false); showBest(); return; }
    // quay lại "Theo ấn": dùng lại kết quả cũ, chưa có thì tìm
    if (emblemView.list.length) { state.run++; state.list = emblemView.list; state.groups = emblemView.groups; state.sel = emblemView.sel || 0; renderTiers(); renderDetail(); setStale(state.dirty); }
    else compute();
  }
  document.querySelector('.views').addEventListener('click', (ev) => { const b = ev.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
  // Bấm tìm khi đang xem "Đội mạnh nhất": về lại "Theo ấn" rồi tìm
  $('go').addEventListener('click', () => { if (state.view === 'best') viewUI('emblem'); search(); });
  $('emblems').addEventListener('click', (ev) => {
    const b = ev.target.closest('.emb');
    if (!b || b.disabled || state.picked.length >= MAX) return;
    state.picked.push(+b.dataset.i); refresh();
  });
  $('slots').addEventListener('click', (ev) => {
    const b = ev.target.closest('.slot.on'); if (!b) return;
    state.picked.splice(+b.dataset.i, 1); refresh();
  });
  $('levels').addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    state.level = +b.dataset.l; refresh();
  });
  $('clear').addEventListener('click', () => { state.picked = []; refresh(); });
  $('clear-units').addEventListener('click', () => { state.locked = []; refresh(); });
  $('clear-bans').addEventListener('click', () => { state.banned = []; refresh(); });
  $('units').addEventListener('click', (ev) => {
    const b = ev.target.closest('.upick'); if (!b || b.disabled) return;
    const u = +b.dataset.u;
    if (state.unitMode === 'carry') {
      state.carry = state.carry === u ? null : u;
      const bi = state.banned.indexOf(u); if (bi >= 0) state.banned.splice(bi, 1);
      refresh();
      return;
    }
    const [list, other, max] = state.unitMode === 'want' ? [state.locked, state.banned, MAX_UNITS] : [state.banned, state.locked, MAX_BANS];
    const at = list.indexOf(u);
    if (at >= 0) list.splice(at, 1);
    else if (list.length < max) { list.push(u); const o = other.indexOf(u); if (o >= 0) other.splice(o, 1); }
    refresh();
  });
  $('want').addEventListener('click', (ev) => { const b = ev.target.closest('.slot.on'); if (!b) return; state.locked.splice(+b.dataset.i, 1); refresh(); });
  $('bans').addEventListener('click', (ev) => { const b = ev.target.closest('.b'); if (!b) return; state.banned.splice(+b.dataset.i, 1); refresh(); });
  $('q').addEventListener('input', renderUnits);
  $('costs').addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; state.cost = +b.dataset.c; $('q').value = ''; renderUnits(); });
  $('m-want').addEventListener('click', () => { state.unitMode = 'want'; renderUnits(); });
  $('m-carry').addEventListener('click', () => { state.unitMode = 'carry'; renderUnits(); });
  $('carry').addEventListener('click', (ev) => { if (ev.target.closest('#carry-slot')) { state.carry = null; refresh(); } });
  $('clear-carry').addEventListener('click', () => { state.carry = null; refresh(); });
  const optClick = (id, key, num) => $(id).addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    const v = b.dataset.v;
    state[key] = num ? (v === '' ? null : +v) : v;
    refresh();
  });
  optClick('opt-dmg', 'dmg', false);
  optClick('opt-unused', 'maxUnused', true);
  optClick('opt-unique', 'maxUnique', true);
  $('m-ban').addEventListener('click', () => { state.unitMode = 'ban'; renderUnits(); });
  const setPick = (p) => {
    $('pt-emb').setAttribute('aria-selected', p === 'emb'); $('pt-unit').setAttribute('aria-selected', p === 'unit');
    $('emblems').hidden = p !== 'emb'; $('unitpick').hidden = p !== 'unit';
  };
  $('pt-emb').addEventListener('click', () => setPick('emb'));
  $('pt-unit').addEventListener('click', () => setPick('unit'));
  $('tiers').addEventListener('click', (ev) => {
    const b = ev.target.closest('.cicon'); if (!b) return;
    state.sel = +b.dataset.k; renderTiers(); renderDetail();
    $('detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  // ---------- Kéo thả tướng trên bàn cờ ----------
  let drag = null;
  function redrawBoard() {
    const c = state.list[state.sel];
    const box = $('boardbox');
    if (!c || !box) return;
    box.querySelector('.hexboard').outerHTML = boardHtml(c);
    $('reset-pos').hidden = !state.pos.has(compKey(c));
    if (!$('zoom').hidden) $('zoomboard').innerHTML = boardHtml(c).replace('class="hexboard"', 'class="hexboard big"');
  }
  function openZoom() {
    const c = state.list[state.sel];
    if (!c) return;
    $('zoom-title').textContent = 'Vị trí xếp · ' + c.title;
    $('zoom').hidden = false;
    $('zoomboard').innerHTML = boardHtml(c).replace('class="hexboard"', 'class="hexboard big"');
    $('zoom-close').focus();
  }
  const closeZoom = () => { $('zoom').hidden = true; };
  $('zoom-close').addEventListener('click', closeZoom);
  $('zoom').addEventListener('click', (ev) => { if (ev.target === $('zoom')) closeZoom(); });
  $('zoom-reset').addEventListener('click', () => { state.pos.delete(compKey(state.list[state.sel])); redrawBoard(); });
  window.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && !$('zoom').hidden) closeZoom(); });
  document.addEventListener('pointerdown', (ev) => {
    const el = ev.target.closest('.hexboard .u, .box .board .u');
    if (!el || ev.button > 0) return;
    ev.preventDefault();
    // Bóng kéo: bọc trong khung giống bàn cờ gốc để giữ nguyên kích thước và kiểu
    const host = el.closest('.hexboard, .board');
    const ghost = document.createElement('div');
    ghost.className = host.className + ' drag-ghost';
    const r = el.getBoundingClientRect();
    ghost.style.width = r.width + 'px';
    ghost.style.setProperty('--w', r.width + 'px'); // ngoài khung bàn cờ thì đơn vị cqw không còn đúng
    const inner = el.cloneNode(true);
    if (host.classList.contains('hexboard')) {
      const cell = document.createElement('div');
      cell.className = 'c';
      cell.appendChild(inner);
      ghost.appendChild(cell);
    } else ghost.appendChild(inner);
    document.body.appendChild(ghost);
    el.classList.add('dragging');
    drag = { u: +el.dataset.u, el, ghost, over: null, w: r.width, h: r.height, x: ev.clientX, y: ev.clientY, raf: 0 };
    moveGhost();
  });
  // Chỉ cập nhật một lần mỗi khung hình: dời bóng bằng transform (không tính lại bố cục) rồi tìm ô bên dưới
  function moveGhost() {
    if (!drag) return;
    drag.raf = 0;
    drag.ghost.style.transform = `translate3d(${drag.x - drag.w / 2}px, ${drag.y - drag.h / 2}px, 0) scale(1.08)`;
    const cell = document.elementFromPoint(drag.x, drag.y)?.closest('.hexboard:not(.drag-ghost) .c');
    if (cell !== drag.over) {
      drag.over?.classList.remove('over');
      cell?.classList.add('over');
      drag.over = cell;
    }
  }
  window.addEventListener('pointermove', (ev) => {
    if (!drag) return;
    drag.x = ev.clientX; drag.y = ev.clientY;
    if (!drag.raf) drag.raf = requestAnimationFrame(moveGhost);
  }, { passive: true });
  const endDrag = (ev) => {
    if (!drag) return;
    const { u, el, ghost, over, raf } = drag;
    if (raf) cancelAnimationFrame(raf);
    drag = null;
    ghost.remove();
    el.classList.remove('dragging');
    over?.classList.remove('over');
    if (!over || ev.type === 'pointercancel') return;
    const c = state.list[state.sel];
    const cells = boardCells(c);
    const from = cells.indexOf(u), to = +over.dataset.p;
    if (from === to) return;
    const other = cells[to];
    cells[to] = u;
    if (from >= 0) cells[from] = other ?? null; // ô có tướng thì hai tướng đổi chỗ
    state.pos.set(compKey(c), cells);
    redrawBoard();
  };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  $('detail').addEventListener('click', (ev) => {
    const vt = ev.target.closest('.vtab');
    if (vt) { state.sel = +vt.dataset.v; renderTiers(); renderDetail(); return; }
    if (ev.target.closest('#zoom-open')) { openZoom(); return; }
    if (!ev.target.closest('#reset-pos')) return;
    state.pos.delete(compKey(state.list[state.sel]));
    redrawBoard();
  });

  // ---------- Thông tin khi di chuột (giữ lâu trên điện thoại) vào tướng hoặc ấn ----------
  // Khung thông tin kiểu TFT Academy: viền màu giá tướng, tên + vai trò, tộc/hệ | tầm đánh, giá; kỹ năng (icon, tên, năng lượng, mô tả có số theo sao)
  const ROLE = { Tank: 'Đỡ đòn', Fighter: 'Đấu sĩ', Assassin: 'Sát thủ', Caster: 'Pháp sư', Marksman: 'Xạ thủ', Specialist: 'Đặc biệt' };
  function roleText(unit) {
    const [dmg, kind] = (unit.role || '').split(' ');
    return [ROLE[kind] || kind, dmg === 'Magic' ? 'AP' : dmg === 'Attack' ? 'AD' : ''].filter(Boolean).join(' ');
  }
  const ICON_RANGE = '<svg viewBox="0 0 16 16"><path d="M2 14 12 4M9 3h4v4M2 11l3 3M4 9l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  const ICON_GOLD = '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="#f5c542"/><circle cx="8" cy="8" r="4.2" fill="none" stroke="#a87b12" stroke-width="1.3"/></svg>';
  const ICON_MANA = '<svg viewBox="0 0 16 16"><path d="M8 1.5C6 5 3.5 7.6 3.5 10.2a4.5 4.5 0 0 0 9 0C12.5 7.6 10 5 8 1.5z" fill="currentColor"/></svg>';
  // ⟦ap|250/350/3000⟧ → số tô màu theo loại; ⟦b|…⟧ → in đậm
  const abText = (s) => esc(s).replace(/⟦(\w+)\|([^⟧]*)⟧/g, (_, k, v) => (k === 'b' ? `<b>${v}</b>` : `<b class="st ${k}">${v}</b>`)).replace(/\n/g, '<br>');
  const traitRows = (ts) => ts.map((t) => `<span class="tr"><img src="${D.traits[t].img}" alt="">${esc(D.traits[t].name)}</span>`).join('');
  function unitTip(u) {
    const unit = D.units[u];
    const ab = unit.ab;
    return `<div class="cardh"><b>${esc(baseName(u))}</b><small>${esc(roleText(unit))}</small></div>
      <div class="cardm"><div class="l">${traitRows(unit.traits)}</div>
        <div class="r"><span>${ICON_RANGE}${unit.range || 1}</span><span>${ICON_GOLD}${unit.cost}</span></div></div>
      ${ab ? `<div class="line"></div>
      <div class="abh"><img src="${ab.icon}" alt="" onerror="this.src='${unit.img}'"><div><b>${esc(ab.name)}</b><span class="mana">${ICON_MANA}${ab.mana[0]} / ${ab.mana[1]}</span></div></div>
      <div class="abd">${abText(ab.text)}</div>
      ${ab.rules.length ? `<div class="rules">${ab.rules.map((r) => esc(r)).join('<br>')}</div>` : ''}` : ''}`;
  }
  // Ở bảng chọn ấn: thêm đánh giá ấn (hạng, nên dùng hay đập, tướng cầm tốt nhất)
  function emblemInfo(em) {
    const et = em && ET[em.id];
    if (!et) return '';
    const lines = [et.tier ? 'Hạng ' + et.tier + (VERDICT[et.verdict] ? ' · ' + VERDICT[et.verdict] : '') : '',
      et.holder ? 'Cầm tốt nhất: ' + unitName(et.holder.id) + ' (TB ' + et.holder.avg + ')' : ''].filter(Boolean);
    return lines.length ? '<div class="line"></div><div class="bps">' + lines.map((l) => '<span class="r on">' + esc(l) + '</span>').join('') + '</div>' : '';
  }
  function emblemTip(t, c) {
    const tr = D.traits[t], em = emblemOfTrait.get(t);
    const n = c?.traits.find((x) => x.trait === t)?.count || 0;
    const rows = (tr.rows || []).filter((r) => r.min < 9).map((r) => `<span class="r${n >= r.min && !(tr.rows.find((x) => x.min > r.min && x.min <= n)) ? ' on' : ''}">${esc(r.text)}</span>`).join('');
    const recipe = em?.recipe?.length ? em.recipe.join(' + ') : 'Chỉ có từ lõi nâng cấp / phần thưởng';
    return `<div class="cardh"><b>${esc(em ? em.name : tr.name)}</b><small>Ấn</small></div>
      <div class="abh"><img src="${em ? em.img : tr.img}" alt=""><div><b>Cầm: nhận tộc/hệ ${esc(tr.name)}</b><span class="mana gray">${esc(recipe)}</span></div></div>
      ${rows ? `<div class="line"></div><div class="bps">${rows}</div>` : ''}${c ? '' : emblemInfo(em)}`;
  }
  let tipEl = null, tipFor = null, pressT = 0;
  function showTip(target, x) {
    const c = target.closest('#detail, #zoom') ? state.list[state.sel] : null;
    const isEm = target.dataset.e != null;
    const html = isEm ? emblemTip(+target.dataset.e, c) : unitTip(+target.dataset.u);
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'utip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl); }
    tipEl.style.setProperty('--cc', isEm ? 'var(--yellow)' : `var(--c${D.units[+target.dataset.u].cost})`);
    tipEl.innerHTML = html; tipEl.hidden = false; tipFor = target;
    const r = target.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let left = r.right + 10, top = r.top;
    if (left + w > innerWidth - 8) left = r.left - w - 10;
    if (left < 8) left = Math.min(Math.max(8, (x ?? r.left) - w / 2), innerWidth - w - 8);
    if (top + h > innerHeight - 8) top = Math.max(8, innerHeight - h - 8);
    tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
  }
  const hideTip = () => { if (tipEl) tipEl.hidden = true; tipFor = null; };
  const tipTarget = (el) => el?.closest?.('[data-e], #detail .u, #zoom .u, .path .pu, .up5 .pu, .upick');
  let traitHover = null;
  document.addEventListener('pointerover', (ev) => {
    if (ev.pointerType !== 'mouse' || drag) return;
    const tb = ev.target.closest?.('button.trait');
    if (tb && tb !== traitHover && tb.getAttribute('aria-expanded') !== 'true') { traitHover = tb; traitPopup(+tb.dataset.tr, +tb.dataset.n, tb); }
    else if (!tb && traitHover && !ev.target.closest?.('#tpop')) { if (traitHover.dataset.pinned !== '1') closeTraitPopup(); traitHover = null; }
    const t = tipTarget(ev.target);
    if (t && t !== tipFor) showTip(t);
    else if (!t && tipFor) hideTip();
  });
  document.addEventListener('pointerdown', (ev) => {
    if (ev.pointerType === 'mouse') { hideTip(); return; }
    const t = tipTarget(ev.target);
    clearTimeout(pressT);
    if (t) pressT = setTimeout(() => showTip(t, ev.clientX), 450); else hideTip();
  });
  document.addEventListener('pointermove', (ev) => { if (ev.pointerType !== 'mouse' && drag) clearTimeout(pressT); }, { passive: true });
  document.addEventListener('pointerup', () => clearTimeout(pressT));
  window.addEventListener('scroll', hideTip, { passive: true });

  const setRail = (open) => { $('rail').classList.toggle('open', open); $('scrim').hidden = !open; };
  $('open').addEventListener('click', () => setRail(true));
  $('scrim').addEventListener('click', () => setRail(false));

  // Sao chép mã đội; nếu trình duyệt chặn thì hiện ô chứa mã đã bôi đen sẵn.
  document.addEventListener('click', async (ev) => {
    const b = ev.target.closest('.copy[data-code]'); if (!b) return;
    const code = b.dataset.code, label = b.querySelector('span');
    const text = label.dataset.t || (label.dataset.t = label.textContent);
    try {
      await navigator.clipboard.writeText(code);
      b.classList.add('ok'); b.querySelector('use').setAttribute('href', '#i-check'); label.textContent = 'Đã chép';
      setTimeout(() => { b.classList.remove('ok'); b.querySelector('use').setAttribute('href', '#i-copy'); label.textContent = text; }, 1600);
    } catch (e) {
      const row = b.closest('.rhead') || b.parentElement;
      let box = row.querySelector(':scope > .code');
      if (!box) { box = document.createElement('input'); box.className = 'code'; box.readOnly = true; box.setAttribute('aria-label', 'Mã đội hình'); row.appendChild(box); }
      box.value = code; box.focus(); box.select(); label.textContent = 'Ctrl+C';
    }
  });

  renderPicker(); renderUnits();
  if (state.view === 'best') { state.view = 'emblem'; setView('best'); } else compute();
})();
</script>
